name: AmigaOS 68k

on:
  push:
    branches: [main]
    paths: ["ports/amigaos/**", ".github/workflows/amigaos-68k.yml"]
  pull_request:
    paths: ["ports/amigaos/**", ".github/workflows/amigaos-68k.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.98.1

jobs:
  build:
    # LumaVault runners poll GitHub from bigguy; no inbound connection is used.
    # Never run fork-controlled pull-request code on the Team's machine.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, lumavault]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        env:
          RUSTUP_INIT_SHA256: 20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c
        run: |
          export CARGO_HOME="${RUNNER_TEMP}/cargo"
          export RUSTUP_HOME="${RUNNER_TEMP}/rustup"
          curl --proto '=https' --tlsv1.2 --fail --location --show-error --silent \
            https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
            --output "${RUNNER_TEMP}/rustup-init"
          echo "${RUSTUP_INIT_SHA256}  ${RUNNER_TEMP}/rustup-init" | sha256sum --check --status
          chmod 0755 "${RUNNER_TEMP}/rustup-init"
          "${RUNNER_TEMP}/rustup-init" --yes --no-modify-path --profile minimal \
            --default-toolchain "${RUST_TOOLCHAIN}"
          echo "CARGO_HOME=${CARGO_HOME}" >> "${GITHUB_ENV}"
          echo "RUSTUP_HOME=${RUSTUP_HOME}" >> "${GITHUB_ENV}"
          echo "${CARGO_HOME}/bin" >> "${GITHUB_PATH}"
          "${CARGO_HOME}/bin/rustup" component add rust-src rustfmt clippy
      - name: Verify toolchain
        run: |
          rustc --version --verbose
          command -v m68k-linux-gnu-gcc
          command -v m68k-linux-gnu-nm
          command -v m68k-linux-gnu-readelf
      - name: Build and inspect native port
        run: ports/amigaos/check.sh
