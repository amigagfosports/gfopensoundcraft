name: AmigaOS 68k

on:
  push:
    branches: [main]
    paths: ["ports/amigaos/**", ".github/workflows/amigaos-68k.yml"]
  pull_request:
    paths: ["ports/amigaos/**", ".github/workflows/amigaos-68k.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # LumaVault runners poll GitHub from bigguy; no inbound connection is used.
    # Never run fork-controlled pull-request code on the Team's machine.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, lumavault]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust sources
        run: rustup component add rust-src
      - name: Verify toolchain
        run: |
          command -v m68k-linux-gnu-gcc
          command -v m68k-linux-gnu-nm
          command -v m68k-linux-gnu-readelf
      - name: Build and inspect native port
        run: ports/amigaos/check.sh
