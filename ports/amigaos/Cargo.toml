[workspace]
resolver = "2"

[package]
name = "gfopensoundcraft-amiga"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Native AmigaOS 3.x 68k platform port of SoundCraft"
repository = "https://github.com/AmigaGFOSPorts/gfopensoundcraft"
publish = false

[dependencies]
amiga-runtime = { git = "https://github.com/DalsinAI/gfopenrust", rev = "b918e317775099d6f34072a6614234c39e209d58" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
